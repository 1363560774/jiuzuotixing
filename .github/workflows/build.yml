name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # 单架构 native 打, 不交叉 x64, detach 不 busy, arm64 dmg 可靠产出
      - run: npx electron-builder --mac --arm64 --publish never || true; ls dist/*-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-arm64
          path: |
            dist/*-arm64.dmg
            dist/*-arm64.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # x64 在 arm64 runner 交叉打, detach busy 但 dmg 仍生成, 用 || true; ls 兜底
      - run: npx electron-builder --mac --x64 --publish never || true; ls dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-x64
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: [build-mac-arm64, build-mac-x64, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/latest.yml
            dist/latest-mac.yml
            dist/*.blockmap
